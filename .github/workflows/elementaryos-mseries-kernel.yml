# Build the elementaryos-mseries kernel (Aurora aurora-wip plus the M4 mini GPU commits) the way
# aurora-silicon/alarm-aurora builds linux-aurora: LLVM, Rust 1.99.0, bindgen 0.73.2 behind the
# same wrapper, the distribution config merged with the tree's asahi.config. Build check and
# artifacts only: nothing is packaged, signed or installed.
name: elementaryos-mseries kernel

on:
  push:
    branches: [elementaryos-mseries]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # aurora-silicon/alarm-aurora packages/linux-aurora at this commit supplies config,
  # bindgen-kernel.py and validate-config.py; sha256 values are its PKGBUILD's.
  ALARM_AURORA: 3669a71f64b0246d14383bb03ff5189d648fc569
  CONFIG_SHA256: 0eecd1615eadf03039f945bbe57aa8f94dbb9714605c520f62e4d3d248c54e44
  BINDGEN_WRAPPER_SHA256: 84a03d5fea19cae243c89f50c1736c639622d25d4d1de8d7d53ebd8f603c0f62
  VALIDATE_SHA256: 534214d07ad388822b3d7ca2b63efce988c1424131329775479ebbd7552715b0
  RUST: 1.99.0
  BINDGEN: 0.73.2

jobs:
  build:
    # Repo variable KERNEL_RUNNER selects a self-hosted runner, e.g. ["self-hosted","linux","arm64","m1pro"];
    # without it the job uses GitHub's 4-core Ubuntu 26.04 arm64 runner.
    runs-on: ${{ fromJSON(vars.KERNEL_RUNNER || '"ubuntu-26.04-arm"') }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          if [ "${{ runner.environment }}" != "github-hosted" ]; then
            # Self-hosted: the owner installs the packages once (see the runner notes); only make sure
            # the Rust toolchain and bindgen versions are present.
            command -v rustup >/dev/null || curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            "$HOME/.cargo/bin/rustup" toolchain install "$RUST" --profile minimal -c rust-src -c rustfmt
            "$HOME/.cargo/bin/bindgen" --version 2>/dev/null | grep -q " $BINDGEN" || "$HOME/.cargo/bin/cargo" install --locked bindgen-cli --version "$BINDGEN"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex cpio dwarves \
            device-tree-compiler kmod libelf-dev libssl-dev python3 clang lld llvm libclang-dev ccache
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add --toolchain "$RUST" rust-src rustfmt
          "$HOME/.cargo/bin/cargo" install --locked bindgen-cli --version "$BINDGEN"

      - name: Fetch and verify the Aurora package inputs
        run: |
          base="https://raw.githubusercontent.com/aurora-silicon/alarm-aurora/$ALARM_AURORA/packages/linux-aurora"
          mkdir -p "$RUNNER_TEMP/aurora"
          for f in config bindgen-kernel.py validate-config.py; do
            curl -fsSL "$base/$f" -o "$RUNNER_TEMP/aurora/$f"
          done
          cd "$RUNNER_TEMP/aurora"
          printf '%s  config\n%s  bindgen-kernel.py\n%s  validate-config.py\n' \
            "$CONFIG_SHA256" "$BINDGEN_WRAPPER_SHA256" "$VALIDATE_SHA256" | sha256sum -c -
          chmod +x bindgen-kernel.py

      # The hosted arm64 runner has 4 cores; reuse unchanged C objects between builds.
      # Rust objects are not cached by ccache.
      # Self-hosted runners keep each branch's build tree and the ccache on local disk, so only
      # changed files recompile; only GitHub's runners move the cache through actions/cache.
      - name: Choose the build directory
        run: |
          if [ "${{ runner.environment }}" = "github-hosted" ]; then
            echo "KOUT=$PWD/build" >> "$GITHUB_ENV"
          else
            slug=$(echo "${{ github.ref_name }}" | tr '/' '-')
            echo "KOUT=$HOME/kbuild/$slug" >> "$GITHUB_ENV"
            mkdir -p "$HOME/kbuild"
            # Keep the four most recent branch trees (about 12 GB each).
            ls -1dt "$HOME"/kbuild/*/ 2>/dev/null | tail -n +5 | xargs -r rm -rf
          fi

      - name: Restore the compiler cache
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_name }}-
            ccache-elementaryos-mseries-

      - name: Configure
        run: |
          mkdir -p "$KOUT"
          cp "$RUNNER_TEMP/aurora/config" "$KOUT/.config"
          scripts/kconfig/merge_config.sh -m -O "$KOUT" "$KOUT/.config" arch/arm64/configs/asahi.config
          scripts/config --file "$KOUT/.config" --set-str LOCALVERSION '-elementaryos-mseries' --disable LOCALVERSION_AUTO
          make ARCH=arm64 LLVM=1 O="$KOUT" olddefconfig
          python3 "$RUNNER_TEMP/aurora/validate-config.py" arch/arm64/configs/asahi.config "$KOUT/.config"
          grep -qx 'CONFIG_RUST=y' "$KOUT/.config"
          grep -E '^CONFIG_(DRM_ASAHI|DRM_APPLE|APPLE_PMP|ARM64_16K_PAGES)[A-Z_]*=' "$KOUT/.config" | tee "$KOUT/key-config.txt"

      - name: Build Image, modules and DTBs
        run: |
          export AURORA_BINDGEN_REAL="$HOME/.cargo/bin/bindgen" RUSTUP_TOOLCHAIN="$RUST"
          export LIBCLANG_PATH="$(llvm-config --libdir)"
          export RUSTFMT="$(rustup which --toolchain "$RUST" rustfmt)"
          export CCACHE_DIR="$HOME/.cache/ccache" CCACHE_MAXSIZE=3G CCACHE_COMPILERCHECK=content
          ccache -z
          make ARCH=arm64 LLVM=1 CC="ccache clang" O="$KOUT" BINDGEN="$RUNNER_TEMP/aurora/bindgen-kernel.py" LOCALVERSION= \
            -j"$(nproc)" Image modules apple/t8132-j773g.dtb apple/t8132-j713.dtb 2>&1 | tee "$KOUT/build.log"
          test -f "$KOUT/arch/arm64/boot/Image"
          ccache -s
          test -f "$KOUT/arch/arm64/boot/dts/apple/t8132-j773g.dtb"

      - name: Check the J773g device tree
        run: |
          dtb="$KOUT/arch/arm64/boot/dts/apple/t8132-j773g.dtb"
          fdtget "$dtb" / compatible
          fdtget -t s "$dtb" /aliases pmp
          fdtget -t s "$dtb" /aliases gpu
          fdtget "$dtb" /soc/gpu@302600000 compatible

      - name: Stage artifacts
        run: |
          # Image, device trees and config only (about 50 MB): the packages carry the modules.
          out="$RUNNER_TEMP/out"; rm -rf "$out"; mkdir -p "$out"
          cp "$KOUT"/arch/arm64/boot/Image "$KOUT"/arch/arm64/boot/dts/apple/t8132-*.dtb \
            "$KOUT"/.config "$KOUT"/key-config.txt "$out/"
          make -s O="$KOUT" kernelrelease > "$out/kernelrelease"
          git rev-parse HEAD > "$out/source-commit"
          (cd "$out" && sha256sum Image *.dtb > SHA256SUMS)
          xz -T0 -6 "$out/Image"

      - uses: actions/upload-artifact@v4
        with:
          name: elementaryos-mseries-kernel-${{ github.sha }}
          path: ${{ runner.temp }}/out
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.sha }}
          path: ${{ env.KOUT }}/build.log
          retention-days: 14
